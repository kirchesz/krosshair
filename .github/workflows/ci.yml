# Every push and pull request: build, lint and test on Windows, the only platform krosshair runs on.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # rc.exe from the Windows SDK puts the app icon into the exe (see build.rs).
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release
