[package]
name = "krosshair"
version = "0.1.0"
edition = "2024"
description = "Crosshair overlay drawn through the RivaTuner Statistics Server OSD"
repository = "https://github.com/kirchesz/krosshair"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows = { version = "0.61", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
